name: Update reports

# 데이터를 받아 리포트를 다시 굽고, 실제로 바뀐 게 있을 때만 커밋한다.
# push 되면 Vercel 이 자동으로 재배포한다.
on:
  schedule:
    # UTC 기준. 한국시간 = UTC+9.
    - cron: '30 10 * * 1-5'   # 19:30 KST — 장 마감(15:30) 후 EOD 공표분
    - cron: '30 23 * * 0-4'   # 08:30 KST 다음날 — 늦게 확정되는 계열 재확인
  workflow_dispatch:           # Actions 탭에서 수동 실행
  push:
    # 파이프라인 코드가 바뀌면 바로 돌려서 결과를 확인한다.
    # 문서만 고친 커밋으로는 돌지 않는다.
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/update.yml'

concurrency:
  group: update-reports
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 외부 패키지가 없으므로 install 단계가 없다.
      # 소스 하나가 막혀도(러너 IP 차단 등) 나머지는 갱신되어야 한다.
      # 어느 소스가 실패했는지는 status.json 에 실어 배포한다 —
      # 저장소가 private 이라 Actions 로그를 URL 로 못 보기 때문이다.
      - name: Fetch
        run: |
          echo fetch > "$RUNNER_TEMP/stage"
          ERR=""
          node scripts/fetch-index.mjs   || ERR="$ERR index"
          node scripts/fetch-kofia.mjs   || ERR="$ERR kofia"
          if ! node scripts/fetch-lending.mjs 2>"$RUNNER_TEMP/lending.err"; then
            ERR="$ERR lending"
            DETAIL=$(grep -m1 '^LENDING_FAIL' "$RUNNER_TEMP/lending.err" | head -c 500 | tr -d '"')
            [ -z "$DETAIL" ] && DETAIL=$(head -c 300 "$RUNNER_TEMP/lending.err" | tr '\n' ' ' | tr -d '"')
            echo "LENDING_ERR=$DETAIL" >> "$GITHUB_ENV"
            echo "대차거래 실패: $DETAIL"
          fi
          # PART 3. 실패해도 나머지는 갱신되어야 한다 — analyze 가 파일 없으면 건너뛴다.
          node scripts/fetch-etf.mjs || ERR="$ERR etf"
          # 홍콩 CSOP. 실패하면 어제 스냅샷이 그대로 남는다 — 그걸로 충분하다.
          node scripts/fetch-csop.mjs || ERR="$ERR csop"
          # PART 2 보조. 종목별 대차잔고(FREESIS)와 외국인 지분율(네이버).
          node scripts/fetch-stock-flows.mjs || ERR="$ERR stockflows"
          # 투자자별 순매수. 소스가 20거래일 창만 줘서 매일 받아야 히스토리가 이어진다(§27).
          node scripts/fetch-investor-flows.mjs || ERR="$ERR investorflows"
          # 해외 반도체 공매도. 거래량은 일별, 잔고는 월 2회다(§34).
          node scripts/fetch-global-semis.mjs 10 || ERR="$ERR globalsemis"
          # 국가별 포지셔닝(§36). 롱 사이드(좌수=순자산÷NAV)는 과거를 주는 API 가 없어
          # **매일 받아 누적해야** 히스토리가 생긴다 — 하루 거르면 그날은 영영 빈다.
          node scripts/fetch-country-flows.mjs 10 || ERR="$ERR countryflows"
          echo "FETCH_ERRORS=${ERR# }" >> "$GITHUB_ENV"
          echo "실패한 소스: ${ERR:-없음}"

      # 유가증권/코스닥 분리 신용공여만 아직 API 경로가 없어 커밋된 xlsx 를 쓴다(§8).
      # 파일이 갱신되면 이 단계가 자동으로 반영한다.
      - name: Re-ingest xlsx (if present)
        run: |
          echo ingest > "$RUNNER_TEMP/stage"
          node scripts/ingest-split.mjs || echo "분리 계열 xlsx 없음 — 건너뜀"

      - name: Analyze
        run: |
          echo analyze > "$RUNNER_TEMP/stage"
          node scripts/analyze.mjs

      # 계산이 조용히 깨진 채로 배포되지 않게 한다. 실패하면 커밋도 push 도 하지 않는다.
      - name: Selfcheck
        run: |
          echo selfcheck > "$RUNNER_TEMP/stage"
          node scripts/selfcheck.mjs

      - name: Build
        run: |
          echo build > "$RUNNER_TEMP/stage"
          node scripts/build.mjs
          node scripts/build-email.mjs

      # 저장소가 private 이라 Actions 로그를 URL 로 못 연다.
      # 배포된 사이트의 /status.json 이 그 대체 확인 경로다.
      - name: Write status
        run: |
          echo status > "$RUNNER_TEMP/stage"
          node scripts/status.mjs

      - name: Commit if changed
        run: |
          echo commit > "$RUNNER_TEMP/stage"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain)" ]; then
            echo "변경 없음 — 새 데이터도 없고 status.json 도 그대로다. 커밋 생략."
            exit 0
          fi
          LAST=$(node -e "console.log(require('./data/analysis.json').series.at(-1).d)")
          # status.json 만 바뀌었으면 데이터는 그대로다. 커밋 메시지로 구분해 둔다.
          if [ -z "$(git status --porcelain -- . ':!status.json')" ]; then
            MSG="Refresh status (no new data through ${LAST})"
          else
            MSG="Update reports through ${LAST}"
          fi
          git add -A
          git commit -m "${MSG}"
          # 돌고 있는 사이에 원격이 움직였을 수 있다(사람이 push 하거나 앞선 실행이 커밋하거나).
          # 그대로 push 하면 non-fast-forward 로 거절된다. rebase 후 다시 시도한다.
          #
          # 예전에는 여기서 그냥 `git pull --rebase` 였는데, status.json 은 실행마다 ranBy/runUrl 이
          # 달라 **항상 충돌**한다. 충돌이 나면 rebase 가 중단된 채 스텝이 exit 1 로 죽었다
          # (실제로 두 실행이 겹쳤을 때 그렇게 실패했다).
          # 이 커밋이 건드리는 것은 전부 생성물(index/email/data/status)이고, 이번 실행이 가장
          # 최신 데이터로 방금 만든 것이다. 따라서 충돌하면 우리 쪽을 택하는 게 옳다 —
          # rebase 에서 '적용 중인 커밋'을 가리키는 것은 -X theirs 다(-X ours 는 원격).
          for i in 1 2 3; do
            if git push; then exit 0; fi
            echo "push 거절 (${i}/3) — 원격을 rebase 후 재시도"
            git pull --rebase -X theirs origin main || {
              echo "rebase 실패 — 중단하고 이번 실행은 포기한다(다음 스케줄이 다시 만든다)"
              git rebase --abort || true
              exit 1
            }
          done
          git push

      # 실패해도 그 사실이 배포된 status.json 에 남아야 한다. 저장소가 private 이라
      # Actions 로그를 URL 로 못 보고, 실패한 실행은 위 커밋 단계까지 가지 못하기 때문이다.
      - name: Report failure
        if: failure()
        run: |
          STAGE=$(cat "$RUNNER_TEMP/stage" 2>/dev/null || echo unknown)
          echo "실패 단계: $STAGE"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -- . 2>/dev/null || true
          FAILED_STAGE="$STAGE" node scripts/status.mjs || exit 0
          git add status.json
          git commit -m "Record failed run at stage ${STAGE}" || exit 0
          git pull --rebase origin main || true
          git push || true

      # run: 은 반드시 블록 스칼라(|)로 쓴다. 한 줄로 쓰면 명령 안의 ': '(콜론+공백)을
      # YAML 이 키 구분자로 읽어 워크플로 전체가 파싱 실패한다(실제로 두 번 실패했다).
      - name: Summary
        if: always()
        run: |
          node -e "const a=require('./data/analysis.json');const f=(a.daily&&a.daily.freshness)||[];console.log('## 데이터 최신일');for(const x of f)console.log('- '+x.label+' '+x.date);" >> "$GITHUB_STEP_SUMMARY"
